<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
   
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Explore the portfolio of Tony's Cake Boss Patisserie, showcasing our custom cakes, patisserie items, and creative designs. Get inspired for your next order with our gallery of delicious creations.">
    <meta name="keywords" content="Tony's Cake Boss, cake portfolio, patisserie gallery, custom cakes, cake designs, baked goods showcase">

    <title>Portfolio | Tony's Cake Boss Patisserie</title>


</head>

<body>

    <!-- Website Header -->
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="images/tonys-cake-boss-logo.png" alt="tonys-cake-boss-logo" width="60" height="60">
                Tony's Cake Boss Patisserie
            </a>

            <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
            <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation">
                <span></span>
            </label>

            <nav class="main-nav" aria-label="Main Navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about-us.html">About</a></li>
                    <li><a href="order.html">Order</a></li>
                    <li><a href="contact-us.html">Contact</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                </ul>
            </nav>
        </div>
     </header>

    <!-- Main Page Content -->
    <main class="gallery-page">
        <h1>Portfolio</h1>
        <section class="gallery" aria-label="Portfolio gallery">
            <figure class="gallery-item">
                <button class="lightbox-trigger" type="button" aria-label="View Cake design showcase 1">
                    <img src="images/birthday-cake-1.jpg" alt="Cake design showcase 1">
                </button>
            </figure>
            <figure class="gallery-item">
                <button class="lightbox-trigger" type="button" aria-label="View Cake design showcase 2">
                    <img src="images/birthday-cake-2.jpg" alt="Cake design showcase 2">
                </button>
            </figure>
            <figure class="gallery-item">
                <button class="lightbox-trigger" type="button" aria-label="View Cake design showcase 3">
                    <img src="images/birthday-cake-3.jpg" alt="Cake design showcase 3">
                </button>
            </figure>
            <figure class="gallery-item">
                <button class="lightbox-trigger" type="button" aria-label="View Cake design showcase 4">
                    <img src="images/cupcakes-1.jpg" alt="Cake design showcase 4">
                </button>
            </figure>
            <figure class="gallery-item">
                <button class="lightbox-trigger" type="button" aria-label="View Cake design showcase 5">
                    <img src="images/wedding-cake-1.jpg" alt="Cake design showcase 5">
                </button>
            </figure>
            <figure class="gallery-item">
                <button class="lightbox-trigger" type="button" aria-label="View Cake design showcase 6">
                    <img src="images/doughnuts-2.jpg" alt="Cake design showcase 6">
                </button>
            </figure>
        </section>
    </main>

    <dialog class="lightbox" aria-label="Portfolio image viewer">
        <button class="lightbox-close" type="button" aria-label="Close image viewer">&times;</button>
        <button class="lightbox-previous" type="button" aria-label="Previous image">&#10094;</button>
        <figure class="lightbox-content">
            <img class="lightbox-image" alt="">
            <figcaption class="lightbox-caption"></figcaption>
        </figure>
        <button class="lightbox-next" type="button" aria-label="Next image">&#10095;</button>
        <p class="lightbox-counter" aria-live="polite"></p>
    </dialog>

    <!-- Website Footer -->
    <footer>
        <p>&copy; 2026 Tony's Cake Boss Patisserie. All rights reserved.</p>
    </footer>

    <script src="js/scripts.js" defer></script>
</body>

</html>

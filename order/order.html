 <!-- Website Header -->

     </header>

    <!-- Main Page Content -->
    <main>
<h1>Order</h1>

<form>
<h2>Place Your Order</h2>
<label for="name">Name:</label>
<input type="text" id="name" name="name" required>
<label for="email">Email:</label>
<input type="email" id="email" name="email" required>
<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone" required>
<label for="cake-flavour">Cake Flavour:</label>
<select id="cake-flavour" name="cake-flavour" required>
    <option value="">Select a cake flavour</option>
    <option value="chocolate">Chocolate</option>
    <option value="vanilla">Vanilla</option>
    <option value="red-velvet">Red Velvet</option>
    <option value="carrot">Carrot</option>
    <option value="custom">Custom (Add details in the "Special Instructions" field below)</option>
</select>
<label for="layers">Layers:</label>
<input type="number" id="layers" name="layers" min="1" required>
<label for="pickup-date">Pick-up Date:</label>
<input type="date" id="pickup-date" name="pickup-date" required>
<label for="special-instructions">Special Instructions:</label>
<textarea id="special-instructions" name="special-instructions" rows="4"></textarea>
<label for="inspiration-picture">Inspiration Picture:</label>
<input type="file" id="inspiration-picture" name="inspiration-picture" accept="image/*">
<button type="submit">Submit Order</button>
</form>
        
    </main>
    <script src="js/script.js"></script>
